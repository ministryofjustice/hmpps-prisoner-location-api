---
generic-service:
  replicaCount: 2

  scheduledDowntime:
    enabled: true
    startupOverride: '10 6 * * 1-5' # Start at 6.10am UTC Monday-Friday
    shutdown: '34 21 * * 1-5' # Stop at 9.34pm UTC Monday-Friday

  ingress:
    host: prisoner-location-api-dev.prison.service.justice.gov.uk
    className: modsec-non-prod

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.dev.json
    API_BASE_URL_HMPPS_AUTH: https://sign-in-dev.hmpps.service.justice.gov.uk/auth
    SPRINGDOC_API-DOCS_ENABLED: "true"
    SPRINGDOC_SWAGGER-UI_ENABLED: "true"
    AMENDMENT_ENABLED: "true"
    APPLICATIONINSIGHTS_STATSBEAT_DISABLED: "true"
    JAVA_TOOL_OPTIONS: "$(JAVA_PROXY_TOOL_OPTIONS) -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=50.0"

  namespace_secrets:
    hmpps-envoy-https-proxy-env:
      HTTP_PROXY: "HTTP_PROXY"
      HTTPS_PROXY: "HTTPS_PROXY"
      NO_PROXY: "NO_PROXY"
      JAVA_PROXY_TOOL_OPTIONS: "JAVA_PROXY_TOOL_OPTIONS"

  allowlist:
    groups:
      - internal
      - offloc
    saadian-test: 18.130.78.73/32
    gmp-test: 18.132.155.211/32

generic-prometheus-alerts:
  businessHoursOnly: true
  alertSeverity: syscon-nonprod
